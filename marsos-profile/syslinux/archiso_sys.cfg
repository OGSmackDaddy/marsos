LABEL arch64
TEXT HELP
Boot the marsOS live environment on BIOS (Zen Kernel).
ENDTEXT
MENU LABEL Boot marsOS Cyber Sol - Zen Kernel (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G SYSTEMD_SULOGIN_FORCE=1

LABEL arch64-standard
TEXT HELP
Boot the marsOS live environment on BIOS (Standard Kernel).
ENDTEXT
MENU LABEL Boot marsOS Cyber Sol - Standard Kernel (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G SYSTEMD_SULOGIN_FORCE=1
