name: Build marsOS Live ISO

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish release after successful build'
        required: false
        type: boolean
        default: false

jobs:
  build-iso:
    name: Build marsOS (Cyber Sol) x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU and binfmt-support
        uses: docker/setup-qemu-action@v3

      - name: Build marsOS ISO inside Arch Linux container
        run: |
          mkdir -p dist
          chmod 777 dist
          docker run --privileged --rm \
            -v "${{ github.workspace }}/marsos-profile:/profile:ro" \
            -v "${{ github.workspace }}/dist:/out" \
            archlinux:latest \
            /bin/bash -c "
              set -euo pipefail
              echo '=== Initializing Arch Linux environment ==='
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Syu --noconfirm --needed archiso git e2fsprogs dosfstools squashfs-tools

              echo '=== Building marsOS Live ISO ==='
              mkdir -p /tmp/archiso-work
              mkarchiso -v -w /tmp/archiso-work -o /out /profile

              echo '=== Generating SHA256 Checksums ==='
              cd /out
              sha256sum *.iso > sha256sum.txt
              ls -la /out
            "

      - name: Extract ISO filename
        id: iso-info
        run: |
          ISO_FILE=$(ls dist/*.iso | head -n 1)
          echo "iso_path=$ISO_FILE" >> $GITHUB_OUTPUT
          echo "iso_name=$(basename $ISO_FILE)" >> $GITHUB_OUTPUT

      - name: Upload ISO as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.iso-info.outputs.iso_name }}
          path: |
            dist/*.iso
            dist/sha256sum.txt
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: marsOS Cyber Sol Edition (${{ github.ref_name }})
          tag_name: ${{ github.ref_name }}
          body: |
            # 🔴 marsOS — "Cyber Sol" Edition
            Welcome to the official live installation image of **marsOS**, the Arch Linux distribution blending macOS ergonomics with Martian Cyber aesthetics.

            ### 💾 Integrity Verification
            Check SHA256 hashes against `sha256sum.txt` before flashing to USB:
            ```bash
            sha256sum -c sha256sum.txt
            ```

            ### 🚀 Flashing to USB
            - **BalenaEtcher** or **Raspberry Pi Imager** (Cross-platform GUI)
            - **Rufus** (Windows): Choose *DD Image Mode* when prompted
            - **dd** (Linux/macOS):
              ```bash
              sudo dd if=${{ steps.iso-info.outputs.iso_name }} of=/dev/sdX bs=4M status=progress oflag=sync
              ```
          files: |
            dist/*.iso
            dist/sha256sum.txt
